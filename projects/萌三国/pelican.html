:root {

main { width: min(100%, 1530px); margin: auto; padding: clamp(16px, 2.6vw, 36px) clamp(16px, 4vw, 64px); }

small, .location, button { font: 600 12px/1.5 ui-monospace, "PingFang SC", monospace; letter-spacing: .07em; }

article {
  position: relative;

  background: #c9e5dc;
}
article::after {
  content: "";

  inset: 9px;
  border: 1px solid rgb(255 248 222 / .62);
  z-index: 2;
  pointer-events: none;
}
h1 {
  position: absolute;
  z-index: 1;
  left: 4.5%;
  top: 6%;
  margin: 0;
  color: var(--ink);
}
.headline {
  display: block;
  font: italic bold clamp(42px, 7.8vw, 113px)/.83 Georgia, "Times New Roman", serif;
  letter-spacing: -.075em;
}
.subtitle {
  display: block;

  letter-spacing: .22em;
}
article > svg { display: block; width: 100%; height: auto; }
.location { gap: 10px; }
.location svg { width: 18px; height: 18px; }
.location small { color: #536969; font-size: 10px; font-weight: 400; }
button {
  display: inline-flex;
  gap: 9px;
  align-items: center;
  min-height: 42px;
  color: var(--ink);
  background: transparent;
  border: 1px solid;
  border-radius: 24px;
  padding: 7px 17px;
  cursor: pointer;
}
button::before { content: ""; width: 3px; height: 10px; border-inline: 2px solid; }
main:has(.paused) button::before {
  width: 0; height: 0; border: 5px solid transparent;
  border-left: 8px solid currentColor; border-right: 0;
}
button:hover { background: #e6eadc; }
button:focus-visible { outline: 3px solid #b95135; outline-offset: 3px; }
.wheel { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
.rider { animation: bob 1s ease-in-out infinite alternate; }
.water { animation: drift 4s ease-in-out infinite alternate; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { to { transform: translateY(2px); } }
@keyframes drift { to { transform: translateX(10px); } }
.paused * { animation-play-state: paused !important; }
@media (max-width: 600px) {
  main { padding: 16px 12px; }
  header { padding-bottom: 12px; }
  header small { font-size: 9px; letter-spacing: .07em; }

  h1 { left: 6%; top: 7%; }
  .headline { font-size: clamp(40px, 11vw, 61px); }
  .headline br { display: none; }
  .subtitle { font-size: 14px; margin-top: .65em; }
  .location { gap: 6px; }
  .location small { display: none; }
}

<script>
const scene = document.querySelector('article');
const control = document.querySelector('#motion');
const crank = document.querySelector('#crank');
const legs = ['far', 'near'].map(side => ({
  hipX: side === 'far' ? 619 : 633,
  outline: document.querySelector('#' + side + '-leg'),
  color: document.querySelector('#' + side + '-leg-color'),
  foot: document.querySelector('#' + side + '-foot')
}));

// Bend a pair of equal-length links toward the handlebar, keeping the ankle on the pedal.
function poseLeg(leg, pedalX, pedalY) {
  const ankleX = pedalX - 8;
  const ankleY = pedalY - 10;
  const dx = ankleX - leg.hipX;
  const dy = ankleY - 329;
  const length = Math.hypot(dx, dy);
  const bend = Math.sqrt(Math.max(0, 96 ** 2 - (length / 2) ** 2)) / length;
  const kneeX = leg.hipX + dx / 2 + dy * bend;
  const kneeY = 329 + dy / 2 - dx * bend;
  const path = `M${leg.hipX} 329 L${kneeX} ${kneeY} L${ankleX} ${ankleY}`;
  leg.outline.setAttribute('d', path);
  leg.color.setAttribute('d', path);
  leg.foot.setAttribute('transform', `translate(${pedalX} ${pedalY})`);
}

let phase = -0.55;
let lastTime = null;
let frame = 0;
function drawRide() {
  const dx = 28 * Math.cos(phase);
  const dy = 28 * Math.sin(phase);
  poseLeg(legs[0], 688 - dx, 475 - dy);
  poseLeg(legs[1], 688 + dx, 475 + dy);
  crank.setAttribute('d', `M${688 - dx} ${475 - dy} L${688 + dx} ${475 + dy}`);
}
function tick(time) {
  if (lastTime !== null) phase += Math.min(time - lastTime, 80) * Math.PI / 920;
  lastTime = time;
  drawRide();
  frame = requestAnimationFrame(tick);
}
function pauseMotion(paused) {
  cancelAnimationFrame(frame);
  lastTime = null;
  scene.classList.toggle('paused', paused);
  control.textContent = paused ? '继续骑行' : '暂停动画';
  if (!paused) frame = requestAnimationFrame(tick);
}
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
drawRide();
pauseMotion(motionPreference.matches);
motionPreference.addEventListener('change', event => pauseMotion(event.matches));
control.onclick = () => pauseMotion(!scene.classList.contains('paused'));
</script></html>
