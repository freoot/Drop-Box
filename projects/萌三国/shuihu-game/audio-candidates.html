<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梁山听音 · 五首音乐候选</title><link rel="icon" href="data:,"><link rel="stylesheet" href="audio-candidates.css"></head>
<body><header class="scene"><a href="index.html">返回山寨</a><div><h1>梁山听音</h1><p>三曲闲时风景，两曲出山鼓声。</p></div></header>
<main><section class="player" aria-labelledby="now-title"><div><span id="now-kind">选一首，听听梁山的新声音</span><h2 id="now-title">五首候选，等你试听</h2><p id="now-desc">所有候选统一试听音量，可循环播放；选择保存在试听页，不更换游戏默认音乐。</p></div><audio id="player" controls preload="metadata" loop></audio><div class="controls"><button id="stop" type="button">停止</button><button id="compare" type="button" disabled>切回上一首</button><label><input id="loop" type="checkbox" checked>循环</label><label>试听音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.65"></label></div><p id="status" role="status" aria-live="polite">正在载入曲目</p></section>
<section aria-labelledby="daily"><h2 id="daily">寨中闲时</h2><div id="daily-tracks" class="tracks"></div></section><section aria-labelledby="battle"><h2 id="battle">并肩出山</h2><div id="battle-tracks" class="tracks"></div></section>
<section class="choice"><h2>记下你喜欢的方向</h2><p>可分别保留日常与战斗的选择，回到此页继续比较。</p><p id="selection" aria-live="polite">尚未选择</p><button id="copy" type="button">复制选择</button></section><details><summary>音色与制作说明</summary><p>五首为本轮原创旋律与编配，使用本机系统采样音库渲染。长笛、尼龙弦、Koto 分别近似笛子、琵琶、古筝；目前没有安装专用民乐采样包，因此不称实录民乐。音量统一约 −20 LUFS，均为 30–45 秒循环候选。未购买音源，未替换原曲。</p></details></main><script src="audio-candidates.js"></script></body></html>
