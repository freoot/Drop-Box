<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>僵尸在天上追乌鸦</title>
<style>
  :root{ --k: 1; }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    overflow:hidden;
    background:#070A16;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }

  .scene{
    position:relative;
    width:100vw; height:100vh;
    overflow:hidden;
  }

  /* ---------------- 夜空 ---------------- */
  .sky{
    position:absolute; inset:0;
    background:linear-gradient(180deg,
      #05070F 0%,
      #0B1030 26%,
      #161B45 52%,
      #2A2356 74%,
      #45305F 100%);
  }

  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute;
    border-radius:50%;
    background:#FFF8E2;
    animation:twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.25; transform:scale(.8) }
    50%{ opacity:1; transform:scale(1.15) }
  }

  /* 流星 */
  .shooting{
    position:absolute;
    top:16%; left:60%;
    width:150px; height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.9));
    transform:rotate(24deg);
    opacity:0;
    animation:shoot 11s ease-in infinite;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.8));
  }
  @keyframes shoot{
    0%,88%{ opacity:0; transform:translate(0,0) rotate(24deg) }
    90%{ opacity:1 }
    96%{ opacity:0; transform:translate(-42vw, 18vw) rotate(24deg) }
    100%{ opacity:0 }
  }

  /* ---------------- 月亮 ---------------- */
  .moon{
    position:absolute;
    right:11%; top:9%;
    width:clamp(88px,10vw,150px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 36% 32%, #FDF7E2 0%, #EFE4C2 55%, #D3C69C 100%);
    box-shadow:
      0 0 60px 16px rgba(245,235,195,.22),
      0 0 140px 60px rgba(200,190,255,.12),
      inset -12px -14px 28px rgba(150,140,110,.35);
    z-index:2;
  }
  .moon::before,.moon::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(170,160,130,.28);
    box-shadow:inset 1px 1px 3px rgba(120,110,85,.35);
  }
  .moon::before{ width:26%; height:26%; left:22%; top:30%; }
  .moon::after{ width:16%; height:16%; left:58%; top:58%; }
  .moon-crater{
    position:absolute;
    width:11%; height:11%;
    border-radius:50%;
    background:rgba(170,160,130,.22);
    left:56%; top:22%;
  }

  /* 掠过月亮的薄云 */
  .moon-cloud{
    position:absolute;
    right:6%; top:16%;
    width:34vw; height:26px;
    border-radius:999px;
    background:linear-gradient(90deg, rgba(30,34,70,0), rgba(40,44,88,.85), rgba(30,34,70,0));
    filter:blur(6px);
    animation:moonCloud 18s linear infinite;
    z-index:3;
  }
  @keyframes moonCloud{
    0%{ transform:translateX(30%); opacity:0 }
    12%{ opacity:.9 }
    70%{ opacity:.9 }
    100%{ transform:translateX(-120%); opacity:0 }
  }

  /* ---------------- 云层 ---------------- */
  .lane{
    position:absolute; left:0; top:0;
    width:200vw; height:100%;
    pointer-events:none;
    animation:scroll calc(var(--dur) * var(--k)) linear infinite;
  }
  @keyframes scroll{ to{ transform:translateX(-50%); } }

  .lane > *{
    position:absolute;
    left:var(--x, 0vw);
    top:var(--y, 0);
  }
  .lane > .dup{ left:calc(var(--x, 0vw) + 100vw); }

  .cloud{
    border-radius:999px;
    background:linear-gradient(180deg, rgba(70,76,132,.55), rgba(38,42,84,.75));
    filter:blur(1px);
    opacity:.75;
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:inherit;
  }
  .cloud.a{ width:240px; height:52px; }
  .cloud.a::before{ width:96px;height:96px;left:34px;top:-46px; }
  .cloud.a::after{ width:66px;height:66px;right:38px;top:-30px; }
  .cloud.b{ width:170px; height:38px; }
  .cloud.b::before{ width:70px;height:70px;left:24px;top:-34px; }
  .cloud.b::after{ width:50px;height:50px;right:24px;top:-22px; }

  /* ---------------- 远山与墓园 ---------------- */
  .horizon{
    position:absolute;
    left:0; right:0; bottom:0;
    height:26vh;
    z-index:4;
  }
  .horizon svg{ width:100%; height:100%; display:block; }

  .fog{
    position:absolute;
    left:0; right:0; bottom:0;
    height:34vh;
    background:linear-gradient(180deg, rgba(58,64,116,0), rgba(72,80,132,.32) 55%, rgba(96,104,150,.5) 100%);
    filter:blur(10px);
    z-index:5;
    pointer-events:none;
  }
  .fog.drift{
    height:22vh;
    bottom:2vh;
    background:radial-gradient(ellipse at 30% 60%, rgba(150,160,200,.22), rgba(150,160,200,0) 70%);
    animation:fogDrift 26s ease-in-out infinite alternate;
  }
  @keyframes fogDrift{
    from{ transform:translateX(-6%); opacity:.7 }
    to{ transform:translateX(6%); opacity:1 }
  }

  /* ---------------- 飞行编队 ---------------- */
  .flight{
    position:absolute;
    left:0; top:0;
    width:80vw; height:52vh;
    z-index:8;
    animation:flyAcross calc(30s * var(--k)) linear infinite;
    animation-delay:-13s;
    will-change:transform;
  }
  .flight.f2{
    width:70vw; height:40vh;
    top:6vh;
    opacity:.62;
    filter:blur(.6px);
    animation-duration:calc(42s * var(--k));
    animation-delay:-16s;
  }
  @keyframes flyAcross{
    from{ transform:translateX(122vw) }
    to{ transform:translateX(-102vw) }
  }

  .crow, .zombie{
    position:absolute;
    transform-origin:50% 50%;
  }
  .crow svg, .zombie svg{ display:block; width:100%; height:auto; overflow:visible; }

  .crow{ animation:floatC calc(2.8s * var(--k)) ease-in-out infinite; }
  @keyframes floatC{
    0%,100%{ transform:translateY(0) rotate(-2deg) }
    50%{ transform:translateY(-11px) rotate(3deg) }
  }

  .zombie{ animation:floatZ calc(4.2s * var(--k)) ease-in-out infinite; }
  @keyframes floatZ{
    0%,100%{ transform:translateY(0) rotate(-4deg) }
    50%{ transform:translateY(-16px) rotate(2.5deg) }
  }

  .wing{
    transform-box:view-box;
    transform-origin:58px 38px;
    animation:flap calc(.5s * var(--k)) ease-in-out infinite;
  }
  @keyframes flap{
    0%,100%{ transform:rotate(-16deg) }
    50%{ transform:rotate(20deg) }
  }

  .zarm{ transform-box:view-box; transform-origin:58px 80px; animation:reach calc(2.4s * var(--k)) ease-in-out infinite; }
  @keyframes reach{
    0%,100%{ transform:rotate(-3deg) }
    50%{ transform:rotate(4deg) }
  }

  /* ---------------- 文案 ---------------- */
  .hud{
    position:absolute;
    top:clamp(22px,4.5vh,50px);
    left:clamp(22px,4vw,64px);
    z-index:20;
    color:#EDE9FB;
    pointer-events:none;
  }
  .hud h1{
    font-size:clamp(1.7rem,3.4vw,3rem);
    font-weight:800;
    letter-spacing:.14em;
    color:#F4F0FF;
    text-shadow:0 0 24px rgba(150,160,255,.45), 0 8px 30px rgba(0,0,0,.6);
  }
  .hud p{
    margin-top:.75em;
    font-size:clamp(.76rem,1vw,.95rem);
    letter-spacing:.26em;
    color:#A9B0DA;
  }
  .hud .tag{
    display:inline-block;
    margin-top:1.15em;
    padding:.42em .95em;
    border-radius:999px;
    font-size:clamp(.68rem,.85vw,.8rem);
    letter-spacing:.12em;
    color:#C9CFF2;
    background:rgba(120,130,200,.14);
    border:1px solid rgba(160,170,230,.35);
    backdrop-filter:blur(6px);
  }

  /* 乌鸦叫气泡 */
  .caw{
    position:absolute;
    left:50%; top:30%;
    transform:translate(-50%,0) scale(.4);
    z-index:30;
    padding:.5em 1em;
    border-radius:18px 18px 18px 4px;
    background:#F4F1FF;
    color:#2A2350;
    font-size:clamp(.9rem,1.4vw,1.3rem);
    font-weight:800;
    letter-spacing:.08em;
    box-shadow:0 14px 30px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .16s ease, transform .4s cubic-bezier(.2,1.7,.4,1);
  }
  .caw.show{ opacity:1; transform:translate(-50%,-18px) scale(1); }

  .vignette{
    position:absolute; inset:0;
    z-index:18;
    pointer-events:none;
    background:radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 48%, rgba(4,6,14,.62) 100%);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">

<script>
  /* 星空 */
  (function () {
    var box = document.getElementById('stars');
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 90; i++) {
      var s = document.createElement('span');
      s.className = 'star';
      var size = Math.random() * 2.2 + 0.8;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = (Math.random() * 100) + '%';
      s.style.top = (Math.random() * 72) + '%';
      s.style.animationDelay = (-Math.random() * 4) + 's';
      s.style.animationDuration = (2.4 + Math.random() * 3.6) + 's';
      if (Math.random() > 0.85) {
        s.style.boxShadow = '0 0 6px 1px rgba(255,248,226,.8)';
      }
      frag.appendChild(s);
    }
    box.appendChild(frag);
  })();

  /* 云层复制，实现无缝循环 */
  document.querySelectorAll('.lane').forEach(function (lane) {
    Array.prototype.slice.call(lane.children).forEach(function (child) {
      var dup = child.cloneNode(true);
      dup.classList.add('dup');
      dup.setAttribute('aria-hidden', 'true');
      lane.appendChild(dup);
    });
  });

  /* 点击：全体加速 + 乌鸦叫 */
  var scene = document.getElementById('scene');
  var caw = document.getElementById('caw');
  var root = document.documentElement;
  var t1 = null, t2 = null;

  function scare() {
    root.style.setProperty('--k', '0.45');
    caw.classList.add('show');
    clearTimeout(t1);
    clearTimeout(t2);
    t1 = setTimeout(function () { root.style.setProperty('--k', '1'); }, 1500);
    t2 = setTimeout(function () { caw.classList.remove('show'); }, 1200);
  }

  scene.addEventListener('click', scare);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); scare(); }
  });
</script>
